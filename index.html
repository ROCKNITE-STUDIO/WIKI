<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #18191a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: min(600px, 90%);
            background: #232526;
            border-radius: 18px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0,0,0,.3);
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,.08);
            color: #bbfcfb;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: .9rem;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        p {
            color: #bdbdbd;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #fff;
            color: #18191a;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            transition: .2s;
        }

        .btn:hover {
            background: #bbfcfb;
        }

        @media (max-width:600px){

            .card{
                padding:35px 25px;
            }

            h1{
                font-size:2rem;
            }

        }

    </style>

</head>
<body>

<div class="card">

    <div class="badge">
        ROCKNITE-STUDIO
    </div>

    <h1>🚧 Page en construction</h1>

    <p>
        Cette page est actuellement en cours de développement.
        Revenez prochainement pour découvrir son contenu.
    </p>

    <a href="https://rocknite-studio.com" class="btn">
        Retour à l'accueil
    </a>

</div>

</body>
</html>
