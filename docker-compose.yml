# Wiki ROCKNITE-STUDIO — serveur web statique (nginx)
#
# Lancer :     docker compose up -d
# Arrêter :    docker compose down
# Voir les logs : docker compose logs -f
#
# Le wiki est servi sur http://localhost:7788
# (l'URL publique wiki.rocknite-studio.com/ est gérée
#  par le reverse proxy hébergeur vers ce port.)

services:
  wiki:
    image: nginx:alpine
    container_name: rocknite-studio-wiki
    restart: unless-stopped
    ports:
      - "7788:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
