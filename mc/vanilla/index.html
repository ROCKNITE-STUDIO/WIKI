<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki du Serveur — MC Vanilla</title>
  <meta name="description" content="Wiki des commandes et plugins utiles pour les joueurs du serveur Minecraft.">
  <link rel="icon" href="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/26.2/assets/minecraft/textures/block/furnace_front_on.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Filtre SVG pour teinter la fougère blanche en vert Biome Minecraft -->
  <svg style="display: none;">
    <filter id="minecraft-biome-tint">
      <feColorMatrix type="matrix" values="
        0.33 0    0    0 0
        0.78 0    0    0 0
        0.24 0    0    0 0
        0    0    0    1 0" />
    </filter>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-block"></span>
        <span class="brand-name" id="brand-name">Wiki du Serveur</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème" title="Changer de thème">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 3v2m0-20v2m9 9h2m-20 0h2m4-9.9 1.4 1.4M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m-1.4-14.2-1.4 1.4"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/></svg>
        <input type="search" id="search" placeholder="Rechercher une commande..." autocomplete="off" aria-label="Rechercher">
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Sections du wiki"></nav>
    </aside>

    <main class="content">
      <div class="content-inner" id="content"></div>
      <footer class="footer" id="footer"></footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Infobulle Style Minecraft -->
  <div id="mc-tooltip" class="mc-tooltip" aria-hidden="true">
    <div class="mc-tooltip-title">Item</div>
    <div class="mc-tooltip-desc"></div>
  </div>

  <noscript>
    <p style="padding:1rem;color:#f87171;">Ce wiki nécessite JavaScript pour afficher son contenu.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
